<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="THE MUTANT LAB · I test what AI builds">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C6FF3D" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="#0E1116"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- mark -->
  <rect x="80" y="128" width="104" height="104" rx="26" fill="#C6FF3D"/>
  <text x="132" y="197" text-anchor="middle" font-family="'Archivo Black','Arial Black',Helvetica,Arial,sans-serif" font-weight="900" font-size="46" fill="#0E1116">ML</text>

  <!-- wordmark -->
  <text x="216" y="178" font-family="'Archivo Black','Arial Black',Helvetica,Arial,sans-serif" font-weight="900" font-size="50" letter-spacing="1" fill="#EDEFF3">THE MUTANT LAB</text>
  <text x="218" y="230" font-family="'Space Grotesk',Helvetica,Arial,sans-serif" font-weight="700" font-size="28" fill="#C6FF3D">I test what AI builds</text>
  <text x="220" y="282" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="1.2" fill="#8B95A7">PLAYWRIGHT · TYPESCRIPT · MUTANT SCENARIOS · LLM VERDICTS</text>

  <!-- scoreboard -->
  <rect x="884" y="92" width="316" height="216" rx="18" fill="#07090D" stroke="#2E3543"/>
  <circle cx="908" cy="116" r="5" fill="#2A3545"/><circle cx="926" cy="116" r="5" fill="#2A3545"/><circle cx="944" cy="116" r="5" fill="#2A3545"/>
  <g font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="16">
    <text x="908" y="158" fill="#EDEFF3" font-weight="700">MUTANT SCOREBOARD</text>
    <text x="908" y="192" fill="#C6FF3D">✓ killed    role-swap</text>
    <text x="908" y="218" fill="#C6FF3D">✓ killed    reorder</text>
    <text x="908" y="244" fill="#FF5C7A">✘ SURVIVED  self-grant</text>
    <text x="908" y="284" fill="#8B95A7">5/6 killed · <tspan fill="#FF5C7A">1 survived</tspan></text>
  </g>

  <!-- accent -->
  <rect x="0" y="392" width="160" height="8" fill="#C6FF3D"/>
</svg>
