<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 960px;
        height: 540px;
        overflow: hidden;
        background: #071b2b;
      }
      body {
        font-family: 'Space Grotesk', Helvetica, Arial, sans-serif;
        color: #f4f7f5;
        position: relative;
        background-image:
          linear-gradient(rgba(85, 223, 189, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(85, 223, 189, 0.06) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 8px;
        height: 540px;
        background: #55dfbd;
      }
      .top {
        position: absolute;
        left: 36px;
        top: 22px;
        font-size: 15px;
        color: #abc0c8;
        font-weight: 600;
      }
      svg.stage {
        position: absolute;
        left: 0;
        top: 50px;
      }
      .cap {
        position: absolute;
        left: 36px;
        right: 36px;
        top: 432px;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.2;
        opacity: 0;
      }
      .m {
        color: #55dfbd;
      }
      .c {
        color: #fb8176;
      }
      .g {
        color: #ffc56e;
      }
      .dots {
        position: absolute;
        left: 36px;
        bottom: 18px;
      }
      .dots i {
        display: inline-block;
        width: 26px;
        height: 6px;
        border-radius: 3px;
        background: #214456;
        margin-right: 6px;
      }
      .dots i.on {
        background: #55dfbd;
      }
      .sig {
        position: absolute;
        right: 36px;
        bottom: 14px;
        font-size: 13px;
        color: #55dfbd;
        font-weight: 600;
      }
      text {
        font-family: 'Space Grotesk', Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="top">war-paradigm · explained</div>
    <svg class="stage" width="960" height="380" viewBox="0 0 960 380">
      <defs>

            width="72"

          <path

            stroke="#55DFBD"

            fill="none"

          />
          <rect
            x="24"
            y="80"
            width="52"
            height="46"
            rx="10"
            fill="#123448"
            stroke="#214456"
            stroke-width="3"

        <symbol id="person" viewBox="0 0 100 130">
          <circle cx="50" cy="32" r="24" fill="#ABC0C8" />
          <circle cx="42" cy="30" r="3.5" fill="#071B2B" />
          <circle cx="58" cy="30" r="3.5" fill="#071B2B" />
          <path
            d="M41 40 Q50 46 59 40"

            stroke-width="3"

          <rect

            height="64"
            rx="22"

            stroke="#214456"
            stroke-width="3"

        <marker

          markerHeight="6"

          <path d="M0 0L10 5L0 10z" fill="#55DFBD" />
        </marker>
      </defs>
      <g id="b1"><rect x="60" y="140" width="180" height="90" rx="14" fill="#0D2638" stroke="#55DFBD" stroke-width="3" /><text x="150" y="194" font-size="24" font-weight="700" fill="#F4F7F5" text-anchor="middle">login</text><g id="g0"><g transform="translate(225 140)"><circle r="24" fill="#55DFBD" /><path d="M-11 0 L-3 9 L12 -9" stroke="#071B2B" stroke-width="6" fill="none" stroke-linecap="round" /></g></g><path d="M242 185 H276" stroke="#55DFBD" stroke-width="5" marker-end="url(#ar)" /><rect x="280" y="140" width="180" height="90" rx="14" fill="#0D2638" stroke="#55DFBD" stroke-width="3" /><text x="370" y="194" font-size="24" font-weight="700" fill="#F4F7F5" text-anchor="middle">create</text><g id="g1"><g transform="translate(445 140)"><circle r="24" fill="#55DFBD" /><path d="M-11 0 L-3 9 L12 -9" stroke="#071B2B" stroke-width="6" fill="none" stroke-linecap="round" /></g></g><path d="M462 185 H496" stroke="#55DFBD" stroke-width="5" marker-end="url(#ar)" /><rect x="500" y="140" width="180" height="90" rx="14" fill="#0D2638" stroke="#55DFBD" stroke-width="3" /><text x="590" y="194" font-size="24" font-weight="700" fill="#F4F7F5" text-anchor="middle">approve</text><g id="g2"><g transform="translate(665 140)"><circle r="24" fill="#55DFBD" /><path d="M-11 0 L-3 9 L12 -9" stroke="#071B2B" stroke-width="6" fill="none" stroke-linecap="round" /></g></g><path d="M682 185 H716" stroke="#55DFBD" stroke-width="5" marker-end="url(#ar)" /><rect x="720" y="140" width="180" height="90" rx="14" fill="#0D2638" stroke="#55DFBD" stroke-width="3" /><text x="810" y="194" font-size="24" font-weight="700" fill="#F4F7F5" text-anchor="middle">publish</text><g id="g3"><g transform="translate(885 140)"><circle r="24" fill="#55DFBD" /><path d="M-11 0 L-3 9 L12 -9" stroke="#071B2B" stroke-width="6" fill="none" stroke-linecap="round" /></g></g>
        <text x="480" y="300" font-size="22" fill="#ABC0C8" text-anchor="middle">the golden flow · every test green</text>
      </g>
      <g id="b2">
        <use href="#person" x="80" y="120" width="150" height="195" />
        <text x="155" y="350" font-size="20" fill="#ABC0C8" text-anchor="middle">viewer</text>
        <rect x="260" y="150" width="200" height="80" rx="14" fill="#123448" stroke="#214456" stroke-width="2" />
        <text x="360" y="200" font-size="22" font-weight="700" fill="#F4F7F5" text-anchor="middle">approve</text>
        <path d="M465 190 H545" stroke="#ABC0C8" stroke-width="5" />
        <g transform="translate(560 90)">
          <path d="M60 0 L120 22 V90 C120 140 90 170 60 185 C30 170 0 140 0 90 V22 Z" fill="#0D2638" stroke="#55DFBD" stroke-width="5" />
          <circle cx="42" cy="80" r="9" fill="#55DFBD" /><circle cx="78" cy="80" r="9" fill="#55DFBD" />
        </g>
        <g id="no1"><rect x="700" y="110" width="200" height="70" rx="20" fill="#F4F7F5" /><text x="800" y="157" font-size="30" font-weight="700" fill="#071B2B" text-anchor="middle">403 · NO!</text></g>
        <g id="k1"><rect x="700" y="210" width="200" height="60" rx="30" fill="#55DFBD" /><text x="800" y="249" font-size="24" font-weight="700" fill="#071B2B" text-anchor="middle">✓ KILLED</text></g>
      </g>
      <g id="b3">
        <use href="#person" x="80" y="120" width="150" height="195" />
        <text x="155" y="350" font-size="20" fill="#ABC0C8" text-anchor="middle">editor</text>
        <g id="badge"><circle cx="360" cy="190" r="56" fill="#FFC56E" /><text x="360" y="198" font-size="22" font-weight="700" fill="#071B2B" text-anchor="middle">ADMIN</text></g>
        <path d="M425 190 H545" stroke="#ABC0C8" stroke-width="5" />
        <g transform="translate(560 90)">
          <path d="M60 0 L120 22 V90 C120 140 90 170 60 185 C30 170 0 140 0 90 V22 Z" fill="#0D2638" stroke="#8FA6B0" stroke-width="5" />
          <path d="M32 82 H52 M68 82 H88" stroke="#8FA6B0" stroke-width="6" stroke-linecap="round" />
        </g>
        <text id="zz" x="700" y="110" font-size="36" fill="#8FA6B0" style="font-family: 'Archivo Black', sans-serif">z z z</text>
        <g id="s1"><rect x="700" y="210" width="220" height="60" rx="30" fill="#FB8176" /><text x="810" y="249" font-size="24" font-weight="700" fill="#071B2B" text-anchor="middle">✗ SURVIVED</text></g>
      </g>
      <g id="b4">
        <rect x="200" y="50" width="560" height="280" rx="18" fill="#0D2638" stroke="#214456" stroke-width="2" />
        <text x="480" y="100" font-size="26" font-weight="700" fill="#F4F7F5" text-anchor="middle">MUTANT SCOREBOARD</text>
        <g id="m0"><g transform="translate(240 170)"><circle r="30" fill="#55DFBD" /><path d="M-14 0 L-4 11 L15 -11" stroke="#071B2B" stroke-width="7" fill="none" stroke-linecap="round" /></g></g><g id="m1"><g transform="translate(320 170)"><circle r="30" fill="#55DFBD" /><path d="M-14 0 L-4 11 L15 -11" stroke="#071B2B" stroke-width="7" fill="none" stroke-linecap="round" /></g></g><g id="m2"><g transform="translate(400 170)"><circle r="30" fill="#55DFBD" /><path d="M-14 0 L-4 11 L15 -11" stroke="#071B2B" stroke-width="7" fill="none" stroke-linecap="round" /></g></g><g id="m3"><g transform="translate(480 170)"><circle r="30" fill="#55DFBD" /><path d="M-14 0 L-4 11 L15 -11" stroke="#071B2B" stroke-width="7" fill="none" stroke-linecap="round" /></g></g><g id="m4"><g transform="translate(560 170)"><circle r="30" fill="#55DFBD" /><path d="M-14 0 L-4 11 L15 -11" stroke="#071B2B" stroke-width="7" fill="none" stroke-linecap="round" /></g></g>
        <g id="m5"><g transform="translate(640 170)"><circle r="30" fill="#FB8176" /><path d="M-13 -13 L13 13 M13 -13 L-13 13" stroke="#071B2B" stroke-width="7" stroke-linecap="round" /></g></g><g id="m6"><g transform="translate(720 170)"><circle r="30" fill="#FB8176" /><path d="M-13 -13 L13 13 M13 -13 L-13 13" stroke="#071B2B" stroke-width="7" stroke-linecap="round" /></g></g>
        <text x="480" y="260" font-size="26" fill="#ABC0C8" text-anchor="middle"><tspan fill="#55DFBD" font-weight="700">5 killed</tspan> · <tspan fill="#FB8176" font-weight="700">2 survived</tspan></text>
        <text x="480" y="300" font-size="18" fill="#8FA6B0" text-anchor="middle">experiments/02-mutants</text>
      </g>
    </svg>

    <div class="cap" id="c1">The app's tests are all <span class="m">green</span>. But is the guard awake?</div>
    <div class="cap" id="c2">Break one step: a viewer tries to approve. <span class="m">Caught.</span></div>
    <div class="cap" id="c3">An editor makes themself admin. Nobody stops it: <span class="c">a real bug</span>.</div>
    <div class="cap" id="c4">5 traps caught, 2 slipped. Both stay in <span class="c">red</span> until fixed.</div>

    <div class="dots"><i id="d1"></i><i id="d2"></i><i id="d3"></i><i id="d4"></i></div>
    <div class="sig">Cristian Guerra · QA · Medellín</div>

    <script>
      const t = parseFloat(new URLSearchParams(location.search).get('t') ?? '99');
      const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
      const $ = (id) => document.getElementById(id);
      const vis = (a, b) => Math.min(ease((t - a) / 0.35), b == null ? 1 : ease((b - t) / 0.35));
      const beats = [
        [0, 3],
        [3, 6],
        [6, 9],
        [9, null],
      ];
      beats.forEach(([a, b], i) => {
        const o = vis(a, b);
        $('b' + (i + 1)).style.opacity = o;
        $('c' + (i + 1)).style.opacity = o;
        if (t >= a) $('d' + (i + 1)).classList.add('on');
      });
      for (let i = 0; i < 4; i++) $('g' + i).style.opacity = ease((t - (0.6 + i * 0.4)) / 0.25);
      $('no1').style.opacity = ease((t - 4.0) / 0.3);
      $('k1').style.opacity = ease((t - 4.6) / 0.3);
      $('badge').setAttribute('transform', `translate(${-120 + 120 * ease((t - 6.2) / 0.7)} 0)`);
      $('zz').style.opacity = ease((t - 6.8) / 0.3);
      $('s1').style.opacity = ease((t - 7.4) / 0.3);
      for (let i = 0; i < 7; i++) $('m' + i).style.opacity = ease((t - (9.5 + i * 0.3)) / 0.25);
    </script>
  </body>
</html>
